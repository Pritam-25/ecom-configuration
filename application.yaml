# ==============================================================================
# GLOBAL SHARED CONFIGURATION (Inherited by all microservices)
# ==============================================================================
# Service Name : All Config Clients
# Authority    : Centralized Git Config Repository (ecom-configuration)
# ==============================================================================

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true

spring:
  reactor:
    context-propagation: auto
  output:
    ansi:
      enabled: always

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}