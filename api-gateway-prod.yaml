# ==============================================================================
# API GATEWAY - PRODUCTION PROFILE CONFIGURATION
# ==============================================================================
# Service Name : api-gateway
# Profile      : prod
# ==============================================================================

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 0.1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

gateway:
  client-ip:
    max-trusted-index: ${GATEWAY_CLIENT_IP_MAX_TRUSTED_INDEX:1}

logging:
  level:
    root: WARN
    com.maityp394.apigateway: INFO
